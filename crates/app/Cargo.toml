[package]
name = "daw-app"
description = "The desktop DAW application (GUI + audio device)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "daw"
path = "src/main.rs"

[features]
# Optional audio backends. Defaults: ALSA (Linux), WASAPI (Windows), CoreAudio (macOS).
jack = ["cpal/jack"]             # Linux/macOS/Windows; needs libjack-jackd2-dev on Linux
pipewire = ["cpal/pipewire"]     # Linux; needs libpipewire-0.3-dev + clang
pulseaudio = ["cpal/pulseaudio"] # Linux; needs libpulse-dev
asio = ["cpal/asio"]             # Windows low-latency; needs ASIO SDK + LLVM/clang

[dependencies]
hound.workspace = true
daw-engine.workspace = true
daw-project.workspace = true
daw-core.workspace = true
midir.workspace = true
serde.workspace = true
ron.workspace = true
rtrb.workspace = true
cpal.workspace = true
eframe.workspace = true
assert_no_alloc.workspace = true
no_denormals.workspace = true

# Touchpad pinch on Wayland (pointer-gestures protocol; same crates winit uses).
[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
raw-window-handle = "0.6"
