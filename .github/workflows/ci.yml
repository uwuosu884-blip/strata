name: CI

# Builds and tests on Linux, Windows and macOS for every push / pull request.
# Binaries are uploaded as workflow artifacts (Actions tab → run → Artifacts).
# Tagged releases are published by release.yml.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            exe: ""
          - name: windows-x86_64
            os: windows-latest
            exe: ".exe"
          - name: macos-arm64
            os: macos-latest
            exe: ""

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Linux system libraries
        if: runner.os == 'Linux'
        # --all: JACK/PipeWire dev files for the optional-backend check below
        # (sudo drops the CI variable, so the script can't detect CI itself).
        run: sudo bash scripts/linux-deps.sh --all

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (debug — keeps overflow checks and the no-allocation check)
        shell: bash
        # Failing test names become annotations (job logs need auth).
        run: |
          set +e  # Actions bash uses -eo pipefail; an empty grep must not fail the step
          cargo test --workspace --no-fail-fast 2>&1 | tee /tmp/t.log; s=${PIPESTATUS[0]}
          grep -E "panicked at|^test .* FAILED|^---- " /tmp/t.log | head -20 | sed 's/^/::error::/' || true
          exit $s

      - name: Test (release)
        shell: bash
        # Failing test names become annotations (job logs need auth).
        run: |
          set +e  # Actions bash uses -eo pipefail; an empty grep must not fail the step
          cargo test --workspace --release --no-fail-fast 2>&1 | tee /tmp/t.log; s=${PIPESTATUS[0]}
          grep -E "panicked at|^test .* FAILED|^---- " /tmp/t.log | head -20 | sed 's/^/::error::/' || true
          exit $s

      - name: Build shipping binaries
        run: cargo build --profile dist -p daw-app -p daw-render

      - name: Linux optional backends compile (JACK + PipeWire)
        if: runner.os == 'Linux'
        run: cargo check -p daw-app --features jack,pipewire

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.name }}
          cp target/dist/daw${{ matrix.exe }} target/dist/daw-render${{ matrix.exe }} dist/${{ matrix.name }}/
          cp README.md dist/${{ matrix.name }}/

      - uses: actions/upload-artifact@v4
        with:
          name: daw-${{ matrix.name }}
          path: dist/${{ matrix.name }}
